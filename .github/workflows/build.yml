name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build (debug, simulator)
        run: |
          xcodebuild build \
            -project AIKnowledgeCapturer.xcodeproj \
            -scheme AIKnowledgeCapturer \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Unit Tests
        run: |
          xcodebuild test \
            -project AIKnowledgeCapturer.xcodeproj \
            -scheme AIKnowledgeCapturerUnitTests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: UI Tests
        run: |
          xcodebuild test \
            -project AIKnowledgeCapturer.xcodeproj \
            -scheme AIKnowledgeCapturerUITests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
