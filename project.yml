name: "AIKnowledgeCapturer"
options:
  bundleIdPrefix: "com.yourname"
  deploymentTarget:
    iOS: "18.0"
targets:
  AIKnowledgeCapturer:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.aiknowledgecapturer
    dependencies:
      - target: SaveToKnowledgeCapturer

  SaveToKnowledgeCapturer:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.aiknowledgecapturer.share

  AIKnowledgeCapturerUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.aiknowledgecapturer.unit-tests
        TEST_TARGET_NAME: AIKnowledgeCapturer
    dependencies:
      - target: AIKnowledgeCapturer

  AIKnowledgeCapturerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.aiknowledgecapturer.ui-tests
        TEST_TARGET_NAME: AIKnowledgeCapturer
    dependencies:
      - target: AIKnowledgeCapturer
