name: "AIKnowledgeCapturer"
options:
  bundleIdPrefix: "com.yourname"
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AIKnowledgeCapturer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
      - path: Shared
        type: group
      - path: Resources
        type: group
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.aiknowledgecapturer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      com.apple.security.application-groups:
        - group.com.yourname.aiknowledgecapturer
    dependencies:
      - target: SaveToKnowledgeCapturer

  SaveToKnowledgeCapturer:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        type: group
      - path: Shared
        type: group
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.aiknowledgecapturer.share
    entitlements:
      com.apple.security.application-groups:
        - group.com.yourname.aiknowledgecapturer
